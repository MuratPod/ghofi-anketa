*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

.prog{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.prog>div{flex:1 1 220px}
.bar{height:8px;background:#e6e9ef;border-radius:4px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}

main{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:26px;line-height:1.25;margin:8px 0 12px}

.intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px}

.intro li{margin:6px 0}
nav.toc{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
nav.toc a{padding:10px 14px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--accent);text-decoration:none;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}

.q.done{box-shadow:inset 0 0 0 1px var(--ok)}
.qh{display:flex;gap:12px;align-items:flex-start}
.num{flex:none;min-width:34px;height:34px;border-radius:17px;background:#e8edf9;color:var(--accent-d);font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.star .num{background:#fde6bd;color:var(--star)}
.qt{margin:4px 0;font-weight:500}
fieldset{border:0;padding:0;margin:10px 0 0}
legend{padding:0;font-weight:500;margin-bottom:2px}
.opt{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 6px;border-radius:8px;cursor:pointer}
.opt:hover{background:rgba(29,78,216,.06)}
.opt input[type=checkbox],.opt input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);min-height:44px}
input.pct{width:84px}
input.oth{flex:1;min-width:120px}
textarea{display:block;width:100%;margin-top:12px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;min-height:84px;resize:vertical;background:#fff;color:var(--text)}
label.cm{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
label.cm textarea{margin-top:4px}
:focus-visible{outline:3px solid #93b4ff;outline-offset:1px}
.thanks{font-size:22px;font-weight:600;margin:32px 0 8px}
.actions{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0 48px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{font:inherit;font-weight:600;min-height:48px;padding:0 20px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}

.btn.sec{background:#fff;color:var(--accent)}
.btn.sec:hover{background:#eef3ff}
.btn.danger{background:#fff;color:#b91c1c;border-color:#b91c1c}
.note{flex:1 1 100%;font-size:14px;color:var(--muted);margin:0}
#status{font-size:14px;color:var(--ok);min-height:20px;flex:1 1 100%}
@media(max-width:520px){h1{font-size:22px}.btn{flex:1 1 100%;justify-content:center}}
</style>

(function(){

var KEY='ghofi-anketa-v1';
var V={};
try{ V=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ V={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(V)); }catch(e){} }

function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==='text') e.textContent=attrs[k];
    else if(k==='class') e.className=attrs[k];
    else e.setAttribute(k,attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(c); });
  return e;
}

function textarea(name,ph){
  var t=el('textarea',{'data-k':name,name:name,rows:'3','aria-label':ph});
  t.placeholder=ph; return t;
}

function renderGroup(q,g,gi){
  var fs=el('fieldset');
  if(g.label) fs.appendChild(el('legend',{text:g.label}));
  var base='q'+q.n+'_g'+gi;
  g.options.forEach(function(o,oi){
    var row=el('label',{class:'opt'});
    var inp=el('input',{type:g.type,'data-k':g.type==='radio'?base:base+'_o'+oi,name:g.type==='radio'?base:base+'_o'+oi});
    if(g.type==='radio') inp.value='o'+oi;
    row.appendChild(inp); row.appendChild(el('span',{text:o}));
    if(g.percent){
      var p=el('input',{type:'text',inputmode:'decimal',class:'pct','data-k':base+'_o'+oi+'_pct',name:base+'_o'+oi+'_pct','aria-label':o+', %'});
      p.placeholder=T.pctPh; row.appendChild(p);
    }
    fs.appendChild(row);
  });
  if(g.other){
    var r=el('label',{class:'opt'});
    var ci=el('input',{type:g.type,'data-k':g.type==='radio'?base:base+'_other',name:g.type==='radio'?base:base+'_other'});
    if(g.type==='radio') ci.value='other';
    r.appendChild(ci); r.appendChild(el('span',{text:T.other}));
    var ot=el('input',{type:'text',class:'oth','data-k':base+'_othertxt',name:base+'_othertxt','aria-label':T.other});
    ot.placeholder=T.otherPh; r.appendChild(ot);
    if(g.percent){
      var op=el('input',{type:'text',inputmode:'decimal',class:'pct','data-k':base+'_other_pct',name:base+'_other_pct','aria-label':T.other+', %'});
      op.placeholder=T.pctPh; r.appendChild(op);
    }
    fs.appendChild(r);
  }
  return fs;
}

function qTitle(q){
  var s='';
  if(q.star) s+='★ ';
  if(q.optional) s+=T.optional+' ';
  return s+q.text;
}

function renderQuestion(q){
  var card=el('section',{class:'q'+(q.star?' star':''),id:'q'+q.n});
  var head=el('div',{class:'qh'});
  head.appendChild(el('div',{class:'num',text:String(q.n)}));
  var body=el('div',{style:'flex:1;min-width:0'});
  var t=qTitle(q).trim();
  if(t) body.appendChild(el('p',{class:'qt',text:t}));
  (q.groups||[]).forEach(function(g,gi){ body.appendChild(renderGroup(q,g,gi)); });
  if(q.after) body.appendChild(el('p',{class:'qt',style:'margin-top:12px',text:q.after}));
  if(q.groups){
    var lab=el('label',{class:'cm',text:T.comment});
    lab.appendChild(textarea('q'+q.n+'_c',T.comment));
    body.appendChild(lab);
  } else {
    body.appendChild(textarea('q'+q.n+'_c',T.answerPh));
  }
  head.appendChild(body); card.appendChild(head);
  return card;
}

function allQuestions(){
  var r=[]; SECTIONS.forEach(function(s){ s.questions.forEach(function(q){ r.push(q); }); }); return r;
}

function render(){
  var app=document.getElementById('app'); app.textContent='';
  document.title=T.title;
  app.appendChild(el('h1',{text:T.title}));
  var intro=el('div',{class:'intro'});
  intro.appendChild(el('p',{text:T.hello,style:'margin-top:0;font-weight:600'}));
  intro.appendChild(el('p',{text:T.intro}));
  var ul=el('ul'); T.bullets.forEach(function(b){ ul.appendChild(el('li',{text:b})); });
  intro.appendChild(ul); app.appendChild(intro);

  var toc=el('nav',{class:'toc','aria-label':T.tocTitle});
  SECTIONS.concat([{id:9,title:SAMPLES.title}]).forEach(function(s){ toc.appendChild(el('a',{href:'#sec'+s.id,text:s.title})); });
  app.appendChild(toc);

  SECTIONS.forEach(function(s){
    app.appendChild(el('h2',{id:'sec'+s.id,text:s.title}));
    s.questions.forEach(function(q){ app.appendChild(renderQuestion(q)); });
  });

  app.appendChild(el('h2',{id:'sec9',text:SAMPLES.title}));
  app.appendChild(el('p',{text:SAMPLES.intro}));
  SAMPLES.items.forEach(function(it,i){
    var card=el('section',{class:'q'});
    card.appendChild(el('p',{class:'qt',text:it.text}));
    if(it.check){
      var row=el('label',{class:'opt'});
      row.appendChild(el('input',{type:'checkbox','data-k':'s'+i+'_chk',name:'s'+i+'_chk'}));
      row.appendChild(el('span',{text:T.sampleCheck}));
      card.appendChild(row);
      var lab=el('label',{class:'cm',text:T.sampleComment});
      lab.appendChild(textarea('s'+i+'_c',T.sampleComment)); card.appendChild(lab);
    } else {
      card.appendChild(textarea('s'+i+'_c',T.answerPh));
    }
    app.appendChild(card);
  });

  app.appendChild(el('p',{class:'thanks',text:T.thanks}));
  var act=el('div',{class:'actions'});
  act.appendChild(el('button',{type:'button',class:'btn',id:'bDl',text:T.download}));
  act.appendChild(el('button',{type:'button',class:'btn sec',id:'bCp',text:T.copy}));
  act.appendChild(el('a',{class:'btn sec',id:'bMail',href:'#',text:T.mail}));
  act.appendChild(el('p',{class:'note',text:T.mailNote}));
  act.appendChild(el('button',{type:'button',class:'btn danger',id:'bClr',text:T.clear}));
  act.appendChild(el('div',{id:'status',role:'status','aria-live':'polite'}));
  app.appendChild(act);

  restore();
  bind();
  refresh();
}

function restore(){
  document.querySelectorAll('[data-k]').forEach(function(i){
    var k=i.getAttribute('data-k'), v=V[k];
    if(i.type==='checkbox') i.checked=!!v;
    else if(i.type==='radio') i.checked=(v===i.value);
    else i.value=(v==null?'':v);
  });
}

function bind(){
  var app=document.getElementById('app');
  function onChange(ev){
    var i=ev.target; if(!i.getAttribute||!i.getAttribute('data-k')) return;
    var k=i.getAttribute('data-k');
    if(i.type==='checkbox') V[k]=i.checked;
    else if(i.type==='radio'){ if(i.checked) V[k]=i.value; }
    else V[k]=i.value;
    save(); refresh();
  }
  app.addEventListener('input',onChange);
  app.addEventListener('change',onChange);
  document.getElementById('bDl').addEventListener('click',download);
  document.getElementById('bCp').addEventListener('click',copy);
  document.getElementById('bMail').addEventListener('click',function(ev){ ev.currentTarget.href=mailHref(); });
  document.getElementById('bClr').addEventListener('click',function(){
    if(!confirm(T.clearConfirm)) return;
    V={}; try{ localStorage.removeItem(KEY); }catch(e){}
    restore(); refresh(); say('');
  });
}

function say(m){ var s=document.getElementById('status'); if(s) s.textContent=m; }

/* ---------- collecting answers ---------- */
function txt(k){ return (V[k]==null?'':String(V[k])).trim(); }

function collectQuestion(q){
  var groups=(q.groups||[]).map(function(g,gi){
    var base='q'+q.n+'_g'+gi, picked=[], other='';
    g.options.forEach(function(o,oi){
      var on=g.type==='radio'?V[base]==='o'+oi:!!V[base+'_o'+oi];
      if(on){ var it={option:o}; if(g.percent && txt(base+'_o'+oi+'_pct')) it.percent=txt(base+'_o'+oi+'_pct'); picked.push(it); }
    });
    if(g.other){
      var on=g.type==='radio'?V[base]==='other':!!V[base+'_other'];
      var ot=txt(base+'_othertxt');
      if(on||ot){ other=ot||'(отмечено)'; if(g.percent && txt(base+'_other_pct')) other+=' — '+txt(base+'_other_pct')+' %'; }
    }
    return {label:g.label||'',selected:picked,other:other};
  });
  var comment=txt('q'+q.n+'_c');
  var answered=!!comment||groups.some(function(g){ return g.selected.length||g.other; });
  return {n:q.n,star:!!q.star,optional:!!q.optional,question:((q.text?q.text+' ':'')+(q.after||'')).trim(),groups:groups,comment:comment,answered:answered};
}

function collectAll(){
  var secs=SECTIONS.map(function(s){ return {title:s.title,questions:s.questions.map(collectQuestion)}; });
  var samples=SAMPLES.items.map(function(it,i){
    return {item:it.text,canSend:it.check?!!V['s'+i+'_chk']:null,comment:txt('s'+i+'_c')};
  });
  return {filled:dateStr(),sections:secs,samples:{title:SAMPLES.title,items:samples}};
}

function dateStr(){
  var d=new Date(), p=function(n){ return (n<10?'0':'')+n; };
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}

function toText(data){
  var L=[];
  L.push(T.title); L.push(T.filledOn+': '+data.filled); L.push('');
  data.sections.forEach(function(s){
    L.push('== '+s.title+' =='); L.push('');
    s.questions.forEach(function(q){
      L.push(q.n+'. '+(q.star?'★ ':'')+(q.optional?T.optional+' ':'')+q.question);
      if(!q.answered){ L.push('   '+T.noAnswer); }
      else{
        q.groups.forEach(function(g){
          var parts=g.selected.map(function(it){ return it.option+(it.percent?' — '+it.percent+' %':''); });
          if(g.other) parts.push(T.otherLbl+': '+g.other);
          if(g.label||parts.length) L.push('   '+(g.label?g.label+' ':'')+(parts.length?T.checked+': '+parts.join('; '):T.noAnswer));
        });
        if(q.comment) L.push('   '+(q.groups.length?T.commentLbl+': ':'')+q.comment.replace(/\n/g,'\n   '));
      }
      L.push('');
    });
  });
  L.push('== '+data.samples.title+' =='); L.push('');
  data.samples.items.forEach(function(it,i){
    L.push((i+1)+'. '+it.item);
    if(it.canSend===null){ L.push('   '+(it.comment?it.comment.replace(/\n/g,'\n   '):T.noAnswer)); }
    else{
      L.push('   '+(it.canSend?T.canSend:T.cannotSend));
      L.push('   '+T.commentLbl+': '+(it.comment?it.comment.replace(/\n/g,'\n   '):T.noAnswer));
    }
    L.push('');
  });
  return L.join('\n');
}

/* ---------- actions ---------- */
function saveFile(name,content,type){
  var blob=new Blob([content],{type:type+';charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },2000);
}

function download(){
  var data=collectAll(), base=T.fileBase+'-'+data.filled;
  saveFile(base+'.txt',toText(data),'text/plain');
  setTimeout(function(){ saveFile(base+'.json',JSON.stringify(data,null,2),'application/json'); },400);
  say(T.downloaded);
}

function copy(){
  var s=toText(collectAll());
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
    say(ok?T.copied:T.copyFail);
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(function(){ say(T.copied); },fallback);
  } else fallback();
}

function mailHref(){
  var s=toText(collectAll());
  if(s.length>1800) s=s.slice(0,1500)+'\n\n'+T.mailCut;
  return 'mailto:'+T.mailTo+'?subject='+encodeURIComponent(T.mailSubject)+'&body='+encodeURIComponent(s);
}

/* ---------- progress ---------- */
function refresh(){
  var qs=allQuestions(), done=0, stars=0, starDone=0;
  qs.forEach(function(q){
    var c=collectQuestion(q);
    if(q.star) stars++;
    if(c.answered){ done++; if(q.star) starDone++; }
    var card=document.getElementById('q'+q.n);
    if(card) card.classList.toggle('done',c.answered);
  });
  document.getElementById('pTxt').textContent=T.progQ+': '+done+' / '+qs.length;
  document.getElementById('sTxt').textContent=T.progStar+': '+starDone+' / '+stars;
  document.getElementById('pBar').style.width=(100*done/qs.length)+'%';
  document.getElementById('sBar').style.width=(100*starDone/stars)+'%';
}

render();
})();
</script>
